<style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent scrolling for the background shader */
        }

        /* Material Icon Styling */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1;
        }

        /* Custom focus rings for accessibility */
        .focus-ring {
            outline: none;
        }
        .focus-ring:focus-within, .focus-ring:focus {
            box-shadow: 0 0 0 2px #006948; /* Primary Emerald */
        }
        
        /* Glassmorphism utility */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
    </style>

<body class="bg-background min-h-screen flex items-center justify-center relative">
<!-- Ambient Shader Background -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">

</div>
<!-- Login Container -->
<div class="relative z-10 w-full max-w-md px-container-padding-mobile sm:px-0">
<!-- Card -->
<div class="glass-card rounded-xl shadow-soft p-8 w-full border border-border-default/50">
<!-- Logo & Header -->
<div class="text-center mb-8 flex flex-col items-center">
<img alt="MAN 4 Jombang Logo" class="w-20 h-20 mb-4 object-contain rounded-full shadow-sm bg-white p-1" src="https://lh3.googleusercontent.com/aida/AP1WRLs0eSzzzX5fg4unHtSSi0jI_O1VUsDOoExOmsv9ErGHkyjlXyzceBtUQpfxFxqKk6h49cnOzfnN5G2XYxVjID4DQ3I1p1arWmaUGx_qumCMn-o6I_HNRXv1Ac-lhSRMiwQlCFTLuklJcTQvKs5i4XmVd0HUv_YPxXv9960BWJfKiQhXzbHEK4G0GOf5e9ylMp8eIwSh3YAmzfGh66C-IqnzimFFscWgMz_N5ArISSs6p_2QSK59HtPv0G9u"/>
<h1 class="font-headline-lg text-headline-lg text-text-main tracking-tight">MAN 4 Jombang</h1>
<p class="font-body-default text-body-default text-secondary mt-1">Sistem Informasi Akademik Terpadu</p>
</div>
<!-- Login Form -->
<form action="#" class="space-y-6" method="POST">
<!-- Role Selection (Pills) -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2">Login Sebagai</label>
<div class="flex gap-2">
<!-- Guru (Default Active) -->
<label class="flex-1 cursor-pointer">
<input checked="" class="peer sr-only" name="role" type="radio" value="guru"/>
<div class="h-touch-target flex items-center justify-center rounded-DEFAULT border border-border-default bg-surface text-secondary font-label-md text-label-md peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container peer-focus-visible:ring-2 peer-focus-visible:ring-primary transition-all">
                                Guru
                            </div>
</label>
<!-- Siswa -->
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="role" type="radio" value="siswa"/>
<div class="h-touch-target flex items-center justify-center rounded-DEFAULT border border-border-default bg-surface text-secondary font-label-md text-label-md peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container peer-focus-visible:ring-2 peer-focus-visible:ring-primary transition-all">
                                Siswa
                            </div>
</label>
<!-- Admin -->
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="role" type="radio" value="admin"/>
<div class="h-touch-target flex items-center justify-center rounded-DEFAULT border border-border-default bg-surface text-secondary font-label-md text-label-md peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container peer-focus-visible:ring-2 peer-focus-visible:ring-primary transition-all">
                                Admin
                            </div>
</label>
</div>
</div>
<!-- Username/ID Field -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1" for="username">Username / NIP / NISN</label>
<div class="relative focus-ring rounded-DEFAULT">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">person</span>
</div>
<input class="block w-full pl-10 h-touch-target rounded-DEFAULT border-border-default bg-surface-bright font-input-text text-input-text text-text-main placeholder:text-outline-variant focus:border-primary focus:ring-0 transition-colors" id="username" name="username" placeholder="Masukkan ID Anda" required="" type="text"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1" for="password">Password</label>
<div class="relative focus-ring rounded-DEFAULT">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="block w-full pl-10 pr-10 h-touch-target rounded-DEFAULT border-border-default bg-surface-bright font-input-text text-input-text text-text-main placeholder:text-outline-variant focus:border-primary focus:ring-0 transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Footer Actions -->
<div class="flex items-center justify-between mt-2">
<label class="flex items-center gap-2 cursor-pointer group">
<div class="relative flex items-center">
<input class="peer h-5 w-5 rounded border-border-default text-primary focus:ring-primary focus:ring-2 focus:ring-offset-1 bg-surface-bright transition-all cursor-pointer" type="checkbox"/>
</div>
<span class="font-body-default text-body-default text-secondary group-hover:text-text-main transition-colors">Ingat Saya</span>
</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container hover:underline transition-all" href="#">Lupa Password?</a>
</div>
<!-- Submit Button -->
<button class="w-full h-touch-target bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md rounded-DEFAULT shadow-sm hover:shadow-md transition-all flex items-center justify-center gap-2 active:scale-[0.98]" type="submit">
<span>Login</span>
<span class="material-symbols-outlined text-[18px]">login</span>
</button>
</form>
<!-- Support Footer -->
<div class="mt-8 text-center border-t border-border-default/50 pt-4">
<p class="font-body-default text-body-default text-outline text-[13px]">Butuh bantuan akses? Hubungi <a class="text-primary hover:underline" href="#">Tim IT Support</a>.</p>
</div>
</div>
</div>
</body></html>
